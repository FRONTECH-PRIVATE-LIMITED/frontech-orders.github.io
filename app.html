<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>FT Orders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f5fa; --card:#ffffff; --ink:#0b1220; --ink2:#334155; --mute:#64748b; --line:#e5e9f2; --soft:#eef2f8;
  --brand:#4f46e5; --brand2:#7c3aed; --brandSoft:#eef0ff;
  --ok:#059669; --okSoft:#e6f7f0; --ho:#b45309; --hoSoft:#fdf3e3; --bad:#dc2626; --badSoft:#fdecec;
  --hdr1:#0b1220; --hdr2:#1e1b4b;
  --shadow:0 1px 2px rgba(15,23,42,.04),0 6px 24px rgba(15,23,42,.06);
  --shadow2:0 10px 40px rgba(15,23,42,.18);
  --r:18px; --nav:68px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#070b14;--card:#0f1626;--ink:#e8ecf5;--ink2:#c3cad8;--mute:#8b95a8;--line:#1e2738;--soft:#141c2e;
  --brandSoft:#1c1b3d;--okSoft:#0b2a20;--hoSoft:#2d1f08;--badSoft:#2e1010;--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.hidden{display:none!important}

/* ---------- LOGIN ---------- */
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;
  background:radial-gradient(1200px 600px at 10% -10%,#4338ca55,transparent),radial-gradient(900px 500px at 110% 110%,#7c3aed44,transparent),linear-gradient(160deg,#0b1220,#111a33);z-index:50}
.loginCard{width:100%;max-width:380px;color:#fff;animation:rise .5s cubic-bezier(.2,.8,.2,1)}
.logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;font-weight:800;font-size:22px;box-shadow:0 10px 30px #6366f155}
.loginCard h1{font-size:26px;margin:22px 0 4px;letter-spacing:-.02em}
.loginCard p{margin:0 0 26px;color:#aab4cc}
.lf{display:block;margin-bottom:14px}
.lf span{display:block;font-size:12px;color:#aab4cc;margin-bottom:6px;letter-spacing:.04em;text-transform:uppercase}
.lf input{width:100%;height:52px;border-radius:14px;border:1px solid #2a3552;background:#ffffff0d;padding:0 16px;color:#fff;font-size:17px;outline:none;transition:.2s}
.lf input:focus{border-color:#818cf8;background:#ffffff14;box-shadow:0 0 0 4px #6366f133}
.pin{letter-spacing:.5em}
.btn{height:50px;border:0;border-radius:14px;padding:0 20px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s,box-shadow .2s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 8px 22px #4f46e540}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.ok{background:var(--ok);color:#fff}
.btn.danger{background:var(--badSoft);color:var(--bad)}
.btn.sm{height:38px;border-radius:11px;padding:0 14px;font-size:13.5px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.lerr{min-height:20px;color:#fca5a5;font-size:13.5px;margin:4px 0 10px}

/* ---------- SHELL ---------- */
header{position:sticky;top:0;z-index:20;color:#fff;background:linear-gradient(135deg,var(--hdr1),var(--hdr2));padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 14px;box-shadow:0 6px 24px #0b122033}
.hrow{display:flex;align-items:center;gap:12px;max-width:980px;margin:0 auto}
.hlogo{width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,#6366f1,#a855f7);display:grid;place-items:center;font-weight:800;font-size:15px;flex:none}
.htitle{flex:1;min-width:0}
.htitle b{display:block;font-size:15.5px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.htitle small{color:#a5b0cc;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}
.htitle small span:last-child{overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 0 3px #34d39933;display:inline-block}
.dot.stale{background:#fbbf24;box-shadow:0 0 0 3px #fbbf2433}
.bpill{height:34px;border-radius:999px;border:1px solid #ffffff2a;background:#ffffff12;color:#fff;padding:0 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:6px;cursor:pointer;max-width:150px}
.bpill span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avatar{width:34px;height:34px;border-radius:50%;background:#ffffff1f;display:grid;place-items:center;font-weight:700;font-size:13px;cursor:pointer;flex:none}
main{max-width:980px;margin:0 auto;padding:16px 14px calc(var(--nav) + 120px + var(--safe-b))}
.view{animation:fade .28s ease}
nav{position:fixed;left:0;right:0;bottom:0;z-index:25;height:calc(var(--nav) + var(--safe-b));padding-bottom:var(--safe-b);background:color-mix(in srgb,var(--card) 88%,transparent);backdrop-filter:saturate(1.6) blur(18px);-webkit-backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line);display:flex;justify-content:center}
nav .in{display:flex;width:100%;max-width:560px}
nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--mute);font-size:11.5px;font-weight:600;cursor:pointer;position:relative;transition:color .2s}
nav button svg{width:23px;height:23px;transition:transform .2s}
nav button.on{color:var(--brand)}
nav button.on svg{transform:translateY(-1px) scale(1.06)}
.badge{position:absolute;top:8px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;display:grid;place-items:center;padding:0 5px;font-weight:700;box-shadow:0 0 0 2px var(--card)}

/* ---------- CARDS / FORMS ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px;border:1px solid var(--line)}
.ct{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;gap:10px}
.ct h3{margin:0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:700}
.field{width:100%;height:48px;border-radius:13px;border:1.5px solid var(--line);background:var(--soft);padding:0 14px;outline:none;transition:.18s;font-size:15.5px}
.field:focus{border-color:var(--brand);background:var(--card);box-shadow:0 0 0 4px #4f46e51f}
textarea.field{height:72px;padding:12px 14px;resize:none}
.sbox{position:relative}
.sbox svg.si{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mute);pointer-events:none}
.sbox .field{padding-left:42px}
.sbox .clr{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;border-radius:9px;background:transparent;color:var(--mute);cursor:pointer;font-size:18px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.lbl{font-size:12px;color:var(--mute);font-weight:600;margin:0 0 6px 2px}
.muted{color:var(--mute)}
.small{font-size:12.5px}
.chip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.chip.br{background:var(--okSoft);color:var(--ok)}
.rcv{margin-top:7px;border:1.5px dashed var(--brand);background:transparent;color:var(--brand);font:700 12px/1 inherit;font-family:inherit;border-radius:999px;padding:7px 11px;cursor:pointer;white-space:nowrap}
.rcv.undo{border:0;padding:4px 2px;color:var(--mute);font-weight:600;text-decoration:underline}
.rcv:disabled{opacity:.5}
.rcv.over{border-color:var(--bad);color:var(--bad)}
.rcv.ask{border-style:solid}
.ni .ibtns{display:flex;gap:8px;margin-top:8px}
.ic.sk{background:linear-gradient(135deg,#f59e0b,#ea580c)}
.chip.ho{background:var(--hoSoft);color:var(--ho)}
.chip.no{background:var(--badSoft);color:var(--bad)}
.chip.st-PENDING{background:var(--brandSoft);color:var(--brand)}
.chip.st-EXECUTED{background:var(--okSoft);color:var(--ok)}
.chip.st-CANCELLED{background:var(--badSoft);color:var(--bad)}
.chip.new{background:var(--bad);color:#fff}
.chip i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}

/* results */
.results{margin-top:10px;border-radius:14px;overflow:hidden;border:1px solid var(--line);max-height:min(420px,55vh);overflow-y:auto;background:var(--card)}
.res{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s;align-items:center}
.res:last-child{border-bottom:0}
.res:hover,.res.kb{background:var(--soft)}
.res .code{font-weight:800;font-size:13.5px;letter-spacing:.01em}
.res .desc{font-size:13.5px;color:var(--ink2);margin-top:2px;line-height:1.3}
.res .meta{font-size:11.5px;color:var(--mute);margin-top:4px}
.res .rt{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.res .nrp{font-weight:700;font-size:14px}
mark{background:#fde68a;color:inherit;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme:dark){mark{background:#854d0e}}
.empty{padding:26px 16px;text-align:center;color:var(--mute);font-size:14px}
.added{animation:pulse .6s}

/* cart */
.line{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;background:var(--card);animation:rise .25s ease}
.line .top{display:flex;gap:10px;align-items:flex-start}
.line .code{font-weight:800;font-size:13.5px}
.line .desc{font-size:13px;color:var(--ink2);margin-top:2px}
.x{border:0;background:var(--soft);width:32px;height:32px;border-radius:10px;cursor:pointer;color:var(--mute);flex:none;font-size:16px}
.lgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.mini .lbl{font-size:11px;margin-bottom:4px}
.mini input{width:100%;height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--soft);padding:0 10px;outline:none;font-weight:600;text-align:center;font-size:15px}
.mini input:focus{border-color:var(--brand);background:var(--card)}
.mini input.changed{border-color:#f59e0b;background:#fef3c7;color:#92400e}
.step{display:flex;height:42px;border-radius:11px;border:1.5px solid var(--line);overflow:hidden;background:var(--soft)}
.step button{width:32px;flex:none;padding:0;border:0;background:transparent;font-size:19px;cursor:pointer;color:var(--ink2)}
.step input{flex:1;min-width:0;width:100%;padding:0;border:0;background:transparent;text-align:center;font-weight:800;outline:none;font-size:16px}
.lfoot{display:flex;justify-content:space-between;margin-top:10px;font-size:12.5px;color:var(--mute)}
.lfoot b{color:var(--ink);font-size:14px}

/* partner */
.pchip{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--brandSoft);border:1px solid #c7d2fe66}
.pav{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.dateRow{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);margin-top:12px}

/* summary bar */
.sumbar{position:fixed;left:0;right:0;bottom:calc(var(--nav) + var(--safe-b));z-index:24;padding:10px 14px;pointer-events:none}
.sumin{max-width:952px;margin:0 auto;background:linear-gradient(135deg,#0b1220,#1e1b4b);color:#fff;border-radius:18px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow2);pointer-events:auto;animation:rise .3s ease}
.sumin .lab{font-size:11.5px;color:#a5b0cc}
.sumin .val{font-size:20px;font-weight:800;letter-spacing:-.01em}
.sumin .btn{height:46px}

/* sheet (modal) */
.scrim{position:fixed;inset:0;background:#0b122080;backdrop-filter:blur(3px);z-index:40;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--card);border-radius:24px 24px 0 0;max-height:92vh;overflow-y:auto;padding:10px 18px calc(22px + var(--safe-b));box-shadow:var(--shadow2);animation:up .32s cubic-bezier(.2,.8,.2,1);max-width:640px;margin:0 auto}
.sheet{position:fixed}
.sx{position:absolute;right:14px;top:12px;width:34px;height:34px;border-radius:50%;border:0;background:var(--soft);color:var(--mute);font-size:20px;cursor:pointer;z-index:2}
.grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin:0 44px 4px 0;font-size:20px;letter-spacing:-.02em}
.kv{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14px}
.kv:last-child{border:0}
.kv.big{font-size:18px;font-weight:800;border:0;padding-top:12px}
.rl{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}

/* orders */
.seg{display:flex;background:var(--soft);border-radius:13px;padding:4px;gap:4px;margin-bottom:14px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;height:36px;border-radius:10px;font-weight:700;font-size:13px;color:var(--mute);cursor:pointer;white-space:nowrap;padding:0 10px;transition:.2s}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.1)}
.ord{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);transition:transform .15s}
.ord .h{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;cursor:pointer}
.ord .pn{font-weight:800;font-size:15px}
.ord .sub{font-size:12.5px;color:var(--mute);margin-top:3px}
.ord .amt{font-weight:800;font-size:16px;text-align:right}
.ord .body{margin-top:12px;border-top:1px solid var(--line);padding-top:8px;animation:fade .2s}
.ord .acts{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.ord.sel{border-color:var(--brand);box-shadow:0 0 0 3px #4f46e522}
.cb{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;flex:none;cursor:pointer;transition:.15s;margin-top:2px}
.cb.on{background:var(--brand);border-color:var(--brand);color:#fff}
.grp{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:18px 4px 8px;display:flex;justify-content:space-between}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.fchip{border:1.5px solid var(--line);background:var(--card);height:34px;border-radius:999px;padding:0 13px;font-weight:700;font-size:12.5px;white-space:nowrap;cursor:pointer;color:var(--ink2)}
.fchip.on{background:var(--ink);border-color:var(--ink);color:var(--card)}

/* KPIs */
.hero{background:linear-gradient(135deg,#0b1220,#312e81 70%,#6d28d9);color:#fff;border-radius:22px;padding:20px;margin-bottom:14px;box-shadow:var(--shadow2);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#a78bfa55,transparent 70%)}
.hero .lab{color:#c7d2fe;font-size:12.5px;font-weight:600}
.hero .big{font-size:32px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
.bar{height:10px;border-radius:6px;background:#ffffff22;overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,#34d399,#a3e635);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:var(--shadow)}
.kpi .lab{font-size:11.5px;color:var(--mute);font-weight:600}
.kpi .v{font-size:18px;font-weight:800;margin-top:4px}
.mon{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mon b{font-size:16px}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;color:var(--ink2)}
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th{text-align:left;font-size:11.5px;color:var(--mute);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:8px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.pbar{height:6px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2));border-radius:4px}

/* toast + loader */
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + var(--safe-b) + 92px);transform:translateX(-50%) translateY(30px);opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s;z-index:60;background:#0b1220;color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;box-shadow:var(--shadow2);max-width:92vw;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
#toast.err{background:#991b1b}
.skel{height:76px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--soft),var(--line),var(--soft));background-size:200% 100%;animation:sh 1.2s infinite}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid #ffffff55;border-top-color:#fff;animation:rot .7s linear infinite}
.topbar{position:fixed;top:0;left:0;height:3px;z-index:70;background:linear-gradient(90deg,#818cf8,#c084fc);width:0;transition:width .3s,opacity .3s;opacity:0}
.topbar.on{opacity:1;width:70%}
.success{text-align:center;padding:10px 0 4px}
.tick{width:84px;height:84px;border-radius:50%;background:var(--okSoft);display:grid;place-items:center;margin:6px auto 14px;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.tick svg{width:44px;height:44px;color:var(--ok)}
.menu{position:fixed;top:64px;right:14px;z-index:45;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow2);min-width:220px;padding:6px;animation:fade .15s}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:11px 12px;border-radius:10px;cursor:pointer;font-weight:600}
.menu button:hover{background:var(--soft)}
.menu .who{padding:10px 12px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.warn{background:var(--hoSoft);color:var(--ho);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:12px}

/* bill-from toggle */
.bfrow{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:10px}
.bfrow .lbl{margin:0}
.bfseg{display:flex;background:var(--soft);border-radius:11px;padding:3px;gap:3px}
.bfseg button{border:0;background:transparent;height:32px;padding:0 14px;border-radius:9px;font-weight:700;font-size:12.5px;color:var(--mute);cursor:pointer;display:flex;align-items:center;gap:6px;transition:.18s}
.bfseg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.12)}
.bfseg button .d{width:7px;height:7px;border-radius:50%;background:var(--bad)}
.bfseg button .d.y{background:var(--ok)}
.chip.bf{background:var(--soft);color:var(--ink2)}
.chip.bf.HO{background:var(--hoSoft);color:var(--ho)}
.chip.st-QUERY{background:#fff1e6;color:#c2410c}
@media (prefers-color-scheme:dark){.chip.st-QUERY{background:#3a1d08;color:#fdba74}}
s.old{color:var(--mute);font-weight:500;margin-right:4px}
/* proposal box */
.prop{margin-top:12px;border-radius:14px;padding:12px;background:linear-gradient(135deg,#fff7ed,#fff1e6);border:1px solid #fed7aa}
@media (prefers-color-scheme:dark){.prop{background:#24160a;border-color:#7c2d12}}
.prop b.t{display:block;color:#c2410c;font-size:13px;margin-bottom:6px}

<script>
/* FT Orders on Supabase: replaces google.script.run. The app calls window.__API__(token, action, payload)
   and gets back the same {ok, data} / {ok:false, error, auth} answers as the Apps Script did. */
(function () {
  var SB = 'https://gkomkqelevnfkomdfksh.supabase.co';
  var PK = 'sb_publishable_ctDjGAnANlEL52sDE0yKAg_FrP_I6Ka';          // public by design
  var KEY = 'fso_sb', NET = 'Network problem. Check your connection.';
  var EXPIRED = { ok: false, auth: false, error: 'Session expired. Please log in again.' };
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { return null; } }
  function save(s) { try { if (s) localStorage.setItem(KEY, JSON.stringify(s)); else localStorage.removeItem(KEY); } catch (e) { } }
  var refreshing = null;                     // one refresh at a time (a refresh token can only be used once)
  function refresh(s) {
    if (refreshing) return refreshing;
    refreshing = fetch(SB + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', headers: { apikey: PK, 'content-type': 'application/json' },
      body: JSON.stringify({ refresh_token: s.refresh_token })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (j) {
      var ns = j && j.access_token ? { access_token: j.access_token, refresh_token: j.refresh_token, expires_at: j.expires_at } : null;
      save(ns); return ns;
    }).catch(function () { return 'net'; }).finally(function () { refreshing = null; });
    return refreshing;
  }
  async function session(force) {
    var s = load();
    if (!s) return null;
    if (force || !s.expires_at || s.expires_at * 1000 < Date.now() + 60000) s = await refresh(s);
    return s;
  }
  async function post(path, body, token) {
    var h = { 'content-type': 'application/json', apikey: PK };
    if (token) h.authorization = 'Bearer ' + token;
    return fetch(SB + '/functions/v1/' + path, { method: 'POST', headers: h, body: JSON.stringify(body) });
  }
  window.__API__ = async function (token, action, payload) {
    try {
      if (action === 'login') {
        var lr = await post('login', payload || {});
        var lj = await lr.json();
        if (!lj.ok) return { ok: false, error: lj.error || 'Login failed.' };
        save(lj.session);
        return { ok: true, data: { token: 'sb' } };
      }
      var s = await session(false);
      if (s === 'net') return { ok: false, error: NET };
      if (!s) return EXPIRED;
      if (action === 'logout') {
        fetch(SB + '/auth/v1/logout', { method: 'POST', headers: { apikey: PK, authorization: 'Bearer ' + s.access_token } }).catch(function () { });
        save(null);
        return { ok: true, data: true };
      }
      var r = await post('api', { action: action, payload: payload || {} }, s.access_token);
      if (r.status === 401) {                // token expired early (phone clock etc.): refresh once and retry
        s = await session(true);
        if (s === 'net') return { ok: false, error: NET };
        if (!s) return EXPIRED;
        r = await post('api', { action: action, payload: payload || {} }, s.access_token);
      }
      var j = await r.json();
      if (j && j.auth === false) save(null);
      return j;
    } catch (e) { return { ok: false, error: NET }; }
  };
})();

<script>
(function(){
'use strict';
/* ==================================================================
   CORE
   ================================================================== */
const S = {
  token:null, boot:null, user:null, branch:null, tab:null,
  catalog:{}, partners:{}, cart:[], partner:null, cd:'', remarks:'',
  myOrders:null, branchOrders:{}, salesCache:{}, filters:{ord:'PENDING', acc:'ALL', hist:'EXECUTED', grp:'sp'}, selected:new Set(), month:null,
  cache:{}, bsel:[], notify:null, sub:null, pf:{by:'',from:'',to:'',sort:'old'}, editing:null, asked:{}
};
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inr = (n,d=0) => '₹' + Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:d,maximumFractionDigits:d});
const inr2 = n => inr(n,2);
const store = {
  get(k,d){ try{ const v=localStorage.getItem('fso_'+k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem('fso_'+k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem('fso_'+k);}catch(e){} }
};
/* cache-first data: screens draw instantly from the last copy, then refresh quietly */
const C = {
  key(k){ return 'c_'+(S.user?S.user.code:'')+'_'+k; },
  get(k){ if(S.cache[k]!==undefined) return S.cache[k]; const v=store.get(C.key(k),null); if(v!==null) S.cache[k]=v; return v; },
  set(k,v){ S.cache[k]=v; store.set(C.key(k),v); },
  del(prefix){ Object.keys(S.cache).forEach(k=>{ if(k.indexOf(prefix)===0) delete S.cache[k]; }); try{ Object.keys(localStorage).forEach(k=>{ if(k.indexOf('fso_'+C.key(prefix))===0) localStorage.removeItem(k); }); }catch(e){} }
};
const isMgr = () => S.user && S.user.role!=='SALES';
const canAct = () => S.user && (S.user.role==='ACCOUNTANT' || S.user.role==='ADMIN');
const ROLE_LABEL = {SALES:'Sales', ACCOUNTANT:'Accounts', HOD:'Sales HOD', ADMIN:'Admin'};
function bselOk(o){ return !S.bsel.length || S.bsel.includes(o.branch); }
let busyN=0;
function busy(on){ busyN+=on?1:-1; $('#topbar').classList.toggle('on', busyN>0); }

function gasRun(token, action, payload){
  return new Promise((res,rej)=>{
    google.script.run.withSuccessHandler(res).withFailureHandler(e=>rej(new Error(e && e.message ? e.message : 'Network problem. Check your connection.'))).api(token, action, payload);
  });
}
async function call(action, payload, opts={}){
  if(!opts.silent) busy(true);
  try{
    const runner = window.__API__ || gasRun;
    const r = await runner(S.token, action, payload||{});
    if(!r || !r.ok){
      if(r && r.auth===false){ logoutLocal(); throw new Error(r.error); }
      throw new Error((r && r.error) || 'Something went wrong');
    }
    return r.data;
  } finally { if(!opts.silent) busy(false); }
}
let toastT;
function toast(msg, err){
  const t=$('#toast'); t.textContent=msg; t.className = err?'err show':'show';
  clearTimeout(toastT); toastT=setTimeout(()=>t.className=err?'err':'', err?4200:2600);
}
function fmtDate(iso, withTime){
  const d=new Date(iso); if(isNaN(d)) return '';
  const o={day:'2-digit',month:'short'}; if(withTime){o.hour='numeric';o.minute='2-digit';}
  return d.toLocaleString('en-IN',o);
}
function monthLabel(m){ const [y,mo]=m.split('-'); return new Date(+y,+mo-1,1).toLocaleString('en-IN',{month:'long',year:'numeric'}); }
function shiftMonth(m,dx){ const [y,mo]=m.split('-').map(Number); const d=new Date(y,mo-1+dx,1); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }

const IC = {
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/><rect x="3" y="3" width="18" height="18" rx="5"/></svg>',
  list:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1.3"/><circle cx="4.5" cy="12" r="1.3"/><circle cx="4.5" cy="18" r="1.3"/></svg>',
  chart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  inbox:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  team:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>',
  box:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8 12 3 3 8v8l9 5 9-5z"/><path d="m3 8 9 5 9-5M12 13v8"/></svg>',
  gear:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',
  search:'<svg class="si" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>'
};

/* ==================================================================
   AUTH
   ================================================================== */
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault();
  const b=$('#lBtn'); b.disabled=true; b.innerHTML='<span class="spin"></span>'; $('#lErr').textContent='';
  try{
    const r = await call('login',{code:$('#lCode').value, pin:$('#lPin').value});
    S.token=r.token; store.set('token', r.token); store.set('lastCode', $('#lCode').value.trim().toUpperCase());
    await boot();
  }catch(err){ $('#lErr').textContent=err.message; }
  finally{ b.disabled=false; b.textContent='Sign in'; }
});
function showLogin(){
  $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#lCode').value = store.get('lastCode','');
  setTimeout(()=>($('#lCode').value?$('#lPin'):$('#lCode')).focus(), 50);
}
function logoutLocal(){ S.token=null; store.del('token'); showLogin(); }

async function boot(){
  const cached = store.get('boot', null);
  const b = await call('bootstrap');
  S.boot=b; S.user=b.user; store.set('boot', b);
  const saved = store.get('branch_'+b.user.code, null);
  const multi = isMgr() && b.user.branches.length>1;
  S.branch = (saved==='ALL' && multi) || b.user.branches.includes(saved) ? saved : (multi ? 'ALL' : b.user.branches[0] || null);
  S.bsel = S.branch && S.branch!=='ALL' && isMgr() ? [S.branch] : [];
  S.month = b.today.slice(0,7);
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  renderHeader(); buildNav();
  const first = S.user.role==='SALES' ? 'order' : S.user.role==='ADMIN' ? 'overview' : 'pending';
  go(first);
  if(cached && cached.stockUpdated !== b.stockUpdated){ S.catalog={}; }
  if(S.branch) loadCatalog(S.branch).catch(()=>{});
  prefetch();
  pollNotify();
}
/* warm every screen in the background so switching tabs is instant */
function prefetch(){
  setTimeout(()=>{
    if(S.user.role==='SALES'){
      refreshMyOrders(true);
      call('sales',{month:S.month,scope:'ME'},{silent:true}).then(r=>C.set('sales_'+S.month,r)).catch(()=>{});

function norm(s){
  return String(s||'').toLowerCase()
    .replace(/[“”″]/g,'"').replace(/[‘’′]/g,"'")
    .replace(/(\d+(?:\.\d+)?)\s*(?:''|"|'|inch(?:es)?\b|in\b)/g,'$1in')
    .replace(/[^a-z0-9.\s/+-]/g,' ').replace(/\s+/g,' ').trim();
}
const compact = s => String(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');

async function loadCatalog(branch, force){
  const key='cat_'+branch, stamp=S.boot.stockKey||S.boot.stockUpdated;
  if(!force){
    if(S.catalog[branch]) return S.catalog[branch];
    const c = store.get(key,null);
    if(c && c.stamp===stamp){ S.catalog[branch]=prep(c); return S.catalog[branch]; }
  }
  const r = await call('catalog',{branch},{silent:!!S.catalog[branch]});
  const c = {stamp, items:r.items, branchColumnFound:r.all?true:r.branchColumnFound, stockColumn:r.stockColumn, all:!!r.all, locations:r.locations||[]};
  store.set(key,c);
  S.catalog[branch]=prep(c);
  if(branch===S.branch && S.cart.length){ S.cart.forEach(l=>{ const x=S.catalog[branch].by[String(l.p).toUpperCase()]; if(x){ l.br=x.br; l.ho=x.ho; } }); if(S.tab==='order' && $('#cartArea')) renderCart(); }
  if(['order','stock'].includes(S.tab)) refreshSearch();
  return S.catalog[branch];
}
function prep(c){
  const hoI = c.all ? c.locations.indexOf(S.boot.settings.hoLabel||'HEAD OFFICE') : -1;
  c.list = c.items.map(a=>{
    const base={p:a[0],d:a[1],c:a[2],b:a[3],n:a[4], hay:norm(a[0]+' '+a[1]+' '+a[2]+' '+a[3]), cc:compact(a[0])};
    if(c.all){ const av=a[5]||[]; base.ho=av.includes(hoI)?1:0; base.br=av.some(k=>k!==hoI)?1:0; base.locs=av.map(k=>c.locations[k]); base.rcLocs=(a[6]||[]).map(k=>c.locations[k]); base.ovLocs=(a[7]||[]).map(k=>c.locations[k]); }
    else { base.br=a[5]; base.ho=a[6]; base.rc=a[7]===1?1:0; base.ov=a[7]===2?1:0; base.hoRc=a[8]?1:0; }
    return base;
  });
  c.by = {}; c.list.forEach(x=>c.by[x.p.toUpperCase()]=x);
  return c;
}
function search(q, limit=40){
  const cat=S.catalog[S.branch]; if(!cat) return null;
  const nq=norm(q); if(!nq) return [];
  const toks=nq.split(' ').filter(Boolean), cq=compact(q);
  const out=[];
  for(const it of cat.list){
    let ok=true, score=0;
    for(const t of toks){
      const tc=compact(t);
      if(it.hay.includes(t)) { score += (it.hay.startsWith(t)||it.hay.includes(' '+t))?6:2; }
      else if(tc && it.cc.includes(tc)) score+=5;
      else { ok=false; break; }
    }
    if(!ok) continue;
    if(cq && it.cc===cq) score+=100; else if(cq && cq.length>2 && it.cc.startsWith(cq)) score+=40;
    score += it.br?8:0; score += it.ho?4:0;
    out.push([score,it]);
  }
  out.sort((a,b)=>b[0]-a[0] || a[1].p.localeCompare(b[1].p));
  return {total:out.length, items:out.slice(0,limit).map(x=>x[1])};
}
function hl(text,q){
  const toks=norm(q).split(' ').filter(t=>t.length>0).map(t=>t.replace(/in$/,'')).filter(Boolean);
  let h=esc(text);
  toks.sort((a,b)=>b.length-a.length).forEach(t=>{ if(t.length<1) return;
    const re=new RegExp('('+t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'); h=h.replace(re,'<mark>$1</mark>'); });
  return h;
}
function avail(it){
  if(it.locs){ const hoL=S.boot.settings.hoLabel||'HEAD OFFICE', ovc=(it.ovLocs||[]).map(l=>`<span class="chip no"><i></i>${esc(l)} · over today</span>`).join(' ');
    return it.locs.length ? it.locs.map(l=>`<span class="chip ${l===hoL?'ho':'br'}"><i></i>${(l===hoL?'HO':esc(l))+((it.rcLocs||[]).includes(l)?' · today':'')}</span>`).join(' ')+(ovc?' '+ovc:'') : (ovc||'<span class="chip no"><i></i>No stock</span>'); }
  const s=[]; if(it.br) s.push('<span class="chip br"><i></i>Branch'+(it.rc?' · today':'')+'</span>');
  if(it.ho) s.push('<span class="chip ho"><i></i>HO'+(it.hoRc?' · today':'')+'</span>');
  if(it.ov) s.push('<span class="chip no"><i></i>Branch · over today</span>');
  else if(!it.br && !it.ho) s.push('<span class="chip no"><i></i>No stock</span>');
  return s.join(' ');
}
/* 'Received today': accounts tap once when an SKU arrives at the branch before the next stock report */
function rcvDepot(){ const c=S.catalog[S.branch]; if(!c) return null; if(!c.all) return S.branch;
  const hoL=S.boot.settings.hoLabel||'HEAD OFFICE', deps=(c.locations||[]).filter(l=>l!==hoL); return deps.length===1?deps[0]:null; }
function rcvBtn(it){
  if(!canAct()){ // sales / HOD: ask accounts about an SKU with no branch stock
    const c=S.catalog[S.branch]; if(!c || c.all || !c.branchColumnFound || it.br) return '';
    return S.asked[it.p] ? '<div><button class="rcv ask" disabled>Asked ✓</button></div>' : `<div><button class="rcv ask" data-ask="${esc(it.p)}">Ask accounts</button></div>`;
  }
  if(!rcvDepot()) return '';
  const c=S.catalog[S.branch], dep=rcvDepot();
  const rc = c.all ? (it.rcLocs||[]).includes(dep) : it.rc;
  const ov = c.all ? (it.ovLocs||[]).includes(dep) : it.ov;
  const has = c.all ? (it.locs||[]).includes(dep) : it.br;
  if(rc) return `<div><button class="rcv undo" data-rcv="${esc(it.p)}" data-act="clear">Undo received</button></div>`;
  if(ov) return `<div><button class="rcv undo" data-rcv="${esc(it.p)}" data-act="clear">Undo stock over</button></div>`;
  if(has) return `<div><button class="rcv over" data-rcv="${esc(it.p)}" data-act="over">Stock over</button></div>`;
  return `<div><button class="rcv" data-rcv="${esc(it.p)}" data-act="received">+ Received today</button></div>`;
}

function resultRows(res,q,mode){

}

function addToCart(p, el){

  return `<div class="rl"><div class="grow"><b>${esc(l.p)}</b> × ${l.o!==undefined&&l.o!==l.q?`<s class="old">${l.o}</s>`:''}${l.q}
    <span class="chip ${l.at==='NONE'?'no':l.at==='HO'?'ho':'br'}" style="height:20px;font-size:10.5px">${l.at==='BOTH'?'BR+HO':l.at}</span>
    <span class="chip bf ${l.bf||'BRANCH'}" style="height:20px;font-size:10.5px">Bill: ${bfLabel(l.bf||'BRANCH')}</span>
    <div class="small muted">${esc(l.d)}</div><div class="small muted">Rate ${inr2(l.r)}${l.r!==l.n?' (NRP '+inr2(l.n)+')':''}${l.s?' · scheme '+inr2(l.s)+'/pc'+(l.sp?' ('+l.sp+'%)':''):''}</div></div><div class="num" style="font-weight:700">${inr2(l.t)}</div></div>`;

function propBox(o,opt){
  const p=o.proposed; if(o.status!=='QUERY'||!p) return '';

    <div class="small" style="margin-top:6px">Invoice value <s class="old">${inr(o.invoice)}</s> <b class="num">${inr(p.invoice)}</b></div>`;
  if(opt.mine) return `<div class="prop"><b class="t">${esc(p.by)} asks you to confirm these changes</b>${body}
    <div class="acts row" style="flex-wrap:wrap"><button class="btn ok sm" data-acc="${esc(o.no)}">Accept changes</button><button class="btn danger sm" data-dec="${esc(o.no)}">Decline</button><button class="btn ghost sm" data-chat="${esc(o.no)}">Reply in chat</button></div></div>`;

      <div class="acts">

  const find=no=>list.find(o=>o.no===no);

  el.querySelectorAll('[data-cb]').forEach(c=>c.onclick=e=>{ e.stopPropagation(); const n=c.dataset.cb; S.selected.has(n)?S.selected.delete(n):S.selected.add(n); onChange&&onChange(); });
  el.querySelectorAll('[data-ex]').forEach(b=>b.onclick=()=>execute([b.dataset.ex]));
  el.querySelectorAll('[data-cn]').forEach(b=>b.onclick=()=>cancelOrder(b.dataset.cn));

  el.querySelectorAll('[data-mod]').forEach(b=>b.onclick=()=>modifyOrder(find(b.dataset.mod)));
  el.querySelectorAll('[data-acc]').forEach(b=>b.onclick=()=>respond(find(b.dataset.acc),true));

function pickFile(accept){ return new Promise(res=>{ const i=document.createElement('input'); i.type='file'; i.accept=accept; i.onchange=()=>res(i.files[0]||null); i.click(); }); }
function fileB64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); }); }
async function shrinkImage(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=url; });
    const max=1800, k=Math.min(1, max/Math.max(img.width,img.height));
    const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    return await new Promise(res=>c.toBlob(b=>res(b),'image/jpeg',0.72));
  } finally { URL.revokeObjectURL(url); }
}
async function uploadInvoice(no, file, ref){
  let blob=file, mime=file.type||'application/pdf';
  if(/^image\//.test(mime)){ blob=await shrinkImage(file); mime='image/jpeg'; }
  const max=(S.boot.settings.invoiceMaxMb||4)*1048576;
  if(blob.size>max) throw new Error('File is too large ('+(blob.size/1048576).toFixed(1)+' MB). Max '+(max/1048576)+' MB.');
  return call('attachInvoice',{orderNo:no, base64:await fileB64(blob), mime, ref:ref||''});
}
async function attachInvoice(o){
  if(!o) return;
  const f=await pickFile('application/pdf,image/*'); if(!f) return;
  try{ toast('Uploading invoice…'); await uploadInvoice(o.no, f, o.erp); toast('Invoice attached'); afterOrderChange(); }
  catch(e){ toast(e.message,true); }
}
async function viewInvoice(no){
  try{
    const r=await call('getInvoice',{orderNo:no});
    const bin=atob(r.base64), u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
    const url=URL.createObjectURL(new Blob([u],{type:r.mime}));
    const isImg=/^image\//.test(r.mime);
    openSheet(`<h2>Invoice</h2><p class="muted small">${esc(r.name)}</p>
      ${isImg?`<img src="${url}" style="width:100%;border-radius:12px;margin-top:10px;border:1px solid var(--line)">`:''}
      <div class="row" style="margin-top:12px"><a class="btn primary grow" href="${url}" target="_blank" rel="noopener" style="text-decoration:none">Open</a><a class="btn ghost grow" href="${url}" download="${esc(r.name)}" style="text-decoration:none">Download</a></div>`);
  }catch(e){ toast(e.message,true); }
}

async function viewSales(){
  const m=S.month;
  $('#main').innerHTML=`<div class="view"><div class="mon"><button class="ib" id="mp">‹</button><b>${monthLabel(m)}</b><button class="ib" id="mn">›</button></div><div id="sbody">${'<div class="skel" style="height:150px"></div><div class="skel"></div>'}</div></div>`;

  const draw=r=>{
    const ex=r.orders.filter(o=>o.status==='EXECUTED'), pen=r.orders.filter(o=>o.status==='PENDING');
    const ach=ex.reduce((a,o)=>a+o.taxable,0), tgt=r.targets.me||0, pct=tgt?Math.min(100,ach/tgt*100):0;
    $('#sbody').innerHTML=`

function breakdown(ex){
  const sku={}, par={};
  ex.forEach(o=>{ o.items.forEach(l=>{ const k=l.p; sku[k]=sku[k]||{p:l.p,d:l.d,q:0,v:0}; sku[k].q+=l.q; sku[k].v+=l.t; });
    const pk=o.partner+'|'+o.loc; par[pk]=par[pk]||{n:o.partner,l:o.loc,c:0,v:0}; par[pk].c++; par[pk].v+=o.taxable; });
  const sk=Object.values(sku).sort((a,b)=>b.v-a.v), pa=Object.values(par).sort((a,b)=>b.v-a.v);
  const max=sk[0]?sk[0].v:1, maxp=pa[0]?pa[0].v:1;
  if(!ex.length) return '<div class="card empty">No executed orders this month yet.</div>';
  return `<div class="card"><div class="seg" id="bseg" style="margin-bottom:6px"><button class="on" data-b="sku">By SKU</button><button data-b="par">By partner</button><button data-b="ord">Orders</button></div>
    <div data-pane="sku"><table class="t"><tr><th>SKU</th><th class="r">Qty</th><th class="r">Taxable</th></tr>${sk.map(s=>`<tr><td><b>${esc(s.p)}</b><div class="small muted">${esc(s.d)}</div><div class="pbar"><i style="width:${s.v/max*100}%"></i></div></td><td class="r num">${s.q}</td><td class="r num">${inr(s.v)}</td></tr>`).join('')}</table></div>
    <div data-pane="par" class="hidden"><table class="t"><tr><th>Partner</th><th class="r">Orders</th><th class="r">Taxable</th></tr>${pa.map(s=>`<tr><td><b>${esc(s.n)}</b><div class="small muted">${esc(s.l)}</div><div class="pbar"><i style="width:${s.v/maxp*100}%"></i></div></td><td class="r num">${s.c}</td><td class="r num">${inr(s.v)}</td></tr>`).join('')}</table></div>
    <div data-pane="ord" class="hidden"><table class="t"><tr><th>Order</th><th class="r">Taxable</th></tr>${ex.map(o=>`<tr><td><b>${esc(o.partner)}</b><div class="small muted">${esc(o.no)} · ${fmtDate(o.created)}</div></td><td class="r num">${inr(o.taxable)}</td></tr>`).join('')}</table></div></div>`;
}
function bindBreakdown(){
  const seg=$('#bseg'); if(!seg) return;
  seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ seg.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b)); document.querySelectorAll('[data-pane]').forEach(p=>p.classList.toggle('hidden',p.dataset.pane!==b.dataset.b)); });
}

function branchChips(list){
  if(!isMgr() || S.user.branches.length<2) return '';
  const counts={}; list.forEach(o=>counts[o.branch]=(counts[o.branch]||0)+1);
  const bs=S.user.branches.filter(b=>counts[b]||S.bsel.includes(b));
  return `<div class="chips" id="bchips"><button class="fchip ${!S.bsel.length?'on':''}" data-bc="ALL">All branches · ${list.length}</button>${bs.map(b=>`<button class="fchip ${S.bsel.includes(b)?'on':''}" data-bc="${esc(b)}">${esc(b)} · ${counts[b]||0}</button>`).join('')}</div>`;
}
function bindBranchChips(redraw){
  document.querySelectorAll('[data-bc]').forEach(x=>x.onclick=()=>{
    const b=x.dataset.bc;
    if(b==='ALL') S.bsel=[]; else S.bsel = S.bsel.includes(b) ? S.bsel.filter(y=>y!==b) : S.bsel.concat([b]);
    S.branch = S.bsel.length===1 ? S.bsel[0] : 'ALL'; store.set('branch_'+S.user.code, S.branch); renderHeader();
    redraw();
  });
}

async function loadPending(silent){
  try{ const l=await call('branchOrders',{branch:'ALL',status:'OPEN'},{silent}); C.set('open',l); if(S.tab==='pending') drawPending(l); setBadge('pending',l.length); }

function billKey(o){ const ho=o.items.filter(l=>l.bf==='HO').length; return ho===0?'Branch billing':ho===o.items.length?'Head Office billing':'Mixed: Branch + HO'; }
function drawPending(all){
  if(!$('#plist')) return;
  $('#bcw').innerHTML = branchChips(all); bindBranchChips(()=>drawPending(C.get('open')||[]));
  const inB=all.filter(bselOk);
  const sel=$('#pfBy'); if(sel){ const ppl={}; inB.forEach(o=>ppl[o.sp]=o.spName); const cur=S.pf.by;
    sel.innerHTML='<option value="">Everyone ('+Object.keys(ppl).length+')</option>'+Object.entries(ppl).sort((a,b)=>a[1].localeCompare(b[1])).map(([c,n])=>`<option value="${esc(c)}" ${c===cur?'selected':''}>${esc(n)} (${esc(c)})</option>`).join(''); }
  const day=iso=>isoDay(new Date(iso));
  const shown=inB.filter(o=>(!S.pf.by||o.sp===S.pf.by) && (!S.pf.from||day(o.created)>=S.pf.from) && (!S.pf.to||day(o.created)<=S.pf.to))
    .sort((a,b)=> S.pf.sort==='new' ? (a.created<b.created?1:-1) : (a.created>b.created?1:-1));
  const fx=$('#pfX'); if(fx) fx.classList.toggle('hidden', !(S.pf.by||S.pf.from||S.pf.to));
  const tot=shown.reduce((a,o)=>a+o.invoice,0);
  $('#pinfo').textContent=`${S.bsel.length?S.bsel.join(', '):(isMgr()&&S.user.branches.length>1?'All branches':S.user.branches[0])} · ${shown.length} orders · ${inr(tot)}`;
  if(!shown.length){ $('#plist').innerHTML=`<div class="card empty">${inB.length?'No pending orders match these filters.':'All clear — no pending orders. New orders appear here automatically.'}</div>`; $('#sumbar').innerHTML=''; return; }
  const g=S.filters.grp;
  const keyOf = g==='partner' ? (o=>o.partner+' · '+o.loc) : g==='bill' ? billKey
    : g==='date' ? (o=>{ const d=new Date(o.created); return d.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'})+' · '+ageText(o.created); })
    : (o=>o.spName+' ('+o.sp+')'+(S.bsel.length!==1 && S.user.branches.length>1?' · '+o.branch:''));
  const groups={}, firstAt={}; shown.forEach(o=>{ const k=keyOf(o); (groups[k]=groups[k]||[]).push(o); if(!(k in firstAt)) firstAt[k]=o.created; });
  const keys=Object.keys(groups).sort((a,b)=> S.pf.sort==='new' ? (firstAt[a]<firstAt[b]?1:-1) : (firstAt[a]>firstAt[b]?1:-1));

  bindOrderCards($('#plist'), shown, ()=>drawPending(C.get('open')||[]));

function drawSelBar(shown){

function execute(nos){

function cancelOrder(no){

    <button class="btn danger block" id="cnGo" style="margin-top:16px">Cancel order</button>`, ()=>{ $('#cnGo').onclick=()=>{ if(!$('#rsn').value.trim()) return toast('Enter a reason',true); setStatus([no],'CANCELLED',{reason:$('#rsn').value}); }; });

async function setStatus(nos,status,extra={}){
  try{
    const r=await call('setStatus',{orderNos:nos,status,...extra});
    closeSheet(); toast(`${r.updated} order${r.updated>1?'s':''} ${status.toLowerCase()}`);
    nos.forEach(n=>S.selected.delete(n));
    const open=C.get('open')||[];
    if(status!=='PENDING') C.set('open', open.filter(o=>!nos.includes(o.no)));
    C.del('hist_'); C.del('team_');
    if(S.tab==='pending'){ drawPending(C.get('open')||[]); loadPending(true); } else go(S.tab);
  }catch(e){ toast(e.message,true); }
}
function csvCell(v){ v=String(v==null?'':v); return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v; }
function exportCsv(orders){
  const head=['Order No','Date','Branch','Sales Person','Partner','Location','Partno','Description','Qty','Bill From','NRP','Rate','Scheme/pc','CD %','Taxable','GST','Line Total','Stock At','Remarks'];
  const rows=[head];
  orders.forEach(o=>o.items.forEach(l=>rows.push([o.no,fmtDate(o.created,true),o.branch,o.spName,o.partner,o.loc,l.p,l.d,l.q,(l.bf==='HO'?'HEAD OFFICE':o.branch),l.n,l.r,l.s||0,o.cd||0,l.t,l.g,(l.t+l.g).toFixed(2),l.at,o.remarks])));
  const csv=rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const tsv=rows.map(r=>r.join('\t')).join('\n');
  const name=`orders_${(S.user.role==='SALES'?S.user.code:(S.bsel.join('-')||'all'))}_${new Date().toISOString().slice(0,10)}.csv`;
  openSheet(`<h2>Export ${orders.length} order${orders.length>1?'s':''}</h2><p class="muted small">${rows.length-1} lines — one row per SKU, ready for ERP entry.</p>
    <button class="btn primary block" id="dl" style="margin-top:14px">Download CSV</button>
    <button class="btn ghost block" id="cp" style="margin-top:10px">Copy for Excel (paste in sheet)</button>`, ()=>{
      $('#dl').onclick=()=>{ try{ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob(['﻿'+csv],{type:'text/csv'})); a.download=name; document.body.appendChild(a); a.click(); a.remove(); toast('CSV downloaded'); }catch(e){ toast('Download blocked — use Copy instead',true);} };
      $('#cp').onclick=async()=>{ try{ await navigator.clipboard.writeText(tsv); toast('Copied — paste into Excel'); }catch(e){ const ta=document.createElement('textarea'); ta.value=tsv; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('Copied — paste into Excel'); } };
  });
}

let chatT=null;
function afterOrderChange(){
  if(S.user.role==='SALES'){ refreshMyOrders(true); }

function openChat(o){
  if(!o) return;
  const quick = (S.user.role==='SALES' || o.sp===S.user.code) ? ['OK, go ahead','Please hold the order','Bill balance from HO','Will confirm with party']
                                      : ['Stock short — can we reduce qty?','Can we bill from HO?','Credit limit issue','Order entered in ERP'];
  openSheet(`<div class="chat"><div><h2 style="font-size:18px">${esc(o.partner)}</h2>
      <div class="row small muted" style="gap:8px;flex-wrap:wrap;margin-top:2px"><span>${esc(o.no)} · ${S.user.role==='SALES'?'Branch accounts':esc(o.spName)}</span><span class="chip st-${o.status}">${stLabel(o,{mine:S.user.role==='SALES'})}</span></div></div>
    <div class="chatlist" id="chatList"><div class="skel" style="height:44px;width:60%"></div><div class="skel" style="height:44px;width:50%;align-self:flex-end"></div></div>
    <div class="quick">${quick.map(q=>`<button>${esc(q)}</button>`).join('')}</div>
    <form class="chatin" id="chatForm"><input class="field" id="chatIn" placeholder="Type a message…" autocomplete="off" maxlength="1000"><button class="btn primary" style="height:48px" id="chatSend">Send</button></form></div>`, el=>{
    const draw=r=>{ const box=$('#chatList'); if(!box) return; const atBottom=box.scrollHeight-box.scrollTop-box.clientHeight<60;
      if(r.side==='VIEW' && !draw.ro){ draw.ro=true; $('#chatForm').innerHTML='<div class="small muted" style="padding:10px 2px">Read only — chat is between the sales person and branch accounts.</div>'; const q=el.querySelector('.quick'); if(q) q.remove(); }
      box.innerHTML = r.messages.length? r.messages.map(m=>{ const sys=/_SYS$/.test(m.role); const me=m.code===S.user.code;
        if(sys) return `<div class="sys"><b>${esc(m.name)}</b> · ${esc(m.text)}<div class="tm">${fmtDate(m.at,true)}</div></div>`;
        return `<div class="bub ${me?'me':'them'}">${me?'':`<div class="who">${esc(m.name)}</div>`}${esc(m.text)}<div class="tm">${fmtDate(m.at,true)}</div></div>`; }).join('')
        : '<div class="empty">No messages yet. Ask about stock, quantity or billing here — everything stays recorded with the order.</div>';
      if(atBottom||!draw.done){ box.scrollTop=box.scrollHeight; draw.done=true; } };
    const load=()=>call('messages',{orderNo:o.no},{silent:true}).then(draw).catch(e=>toast(e.message,true));
    load();
    clearInterval(chatT); chatT=setInterval(()=>{ if(!$('#chatList')){ clearInterval(chatT); afterOrderChange(); return; } if(document.visibilityState==='visible') load(); },6000);
    const send=async txt=>{ txt=(txt||'').trim(); if(!txt) return; const inp=$('#chatIn'); inp.value='';
      const box=$('#chatList'); box.insertAdjacentHTML('beforeend',`<div class="bub me" style="opacity:.6">${esc(txt)}<div class="tm">sending…</div></div>`); box.scrollTop=box.scrollHeight;
      try{ draw(await call('sendMessage',{orderNo:o.no,text:txt},{silent:true})); }catch(e){ toast(e.message,true); inp.value=txt; load(); } };
    $('#chatForm').onsubmit=e=>{ e.preventDefault(); send($('#chatIn').value); };
    el.querySelectorAll('.quick button').forEach(b=>b.onclick=()=>send(b.textContent));
  });
}

/* ==================================================================
   ACCOUNTANT: MODIFY & ASK  /  SALES: ACCEPT OR DECLINE
   ================================================================== */
function modifyOrder(o){
  if(!o) return;
  const base = o.status==='QUERY' && o.proposed ? o.proposed.items : o.items;
  const st = o.items.map(l=>{ const b=base.find(x=>x.p===l.p); return {p:l.p,d:l.d,q:b?b.q:0,orig:l.q,bf:(b&&b.bf)||l.bf||'BRANCH',at:l.at}; });
  const draw=()=>{ $('#modLines').innerHTML = st.map((l,i)=>`<div class="mline ${l.q===0?'rm':''}">
      <div class="row" style="justify-content:space-between"><div class="grow"><b>${esc(l.p)}</b> <span class="small muted">ordered ${l.orig}</span><div class="small muted">${esc(l.d)}</div></div>
        <button class="btn ${l.q===0?'ghost':'danger'} sm" data-rm="${i}">${l.q===0?'Restore':'Remove'}</button></div>
      <div class="mrow"><div class="step"><button data-mm="${i}">−</button><input class="num" data-mq="${i}" inputmode="numeric" value="${l.q}"><button data-mp="${i}">+</button></div>
        <div class="bfseg" data-mbf="${i}"><button class="${l.bf==='BRANCH'?'on':''}" data-bf="BRANCH">Branch</button><button class="${l.bf==='HO'?'on':''}" data-bf="HO">HO</button></div><span></span></div></div>`).join('');
    const m=$('#modLines');
    m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{ const l=st[+b.dataset.rm]; l.q = l.q===0 ? l.orig : 0; draw(); });
    m.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{ const l=st[+b.dataset.mm]; l.q=Math.max(0,l.q-1); draw(); });
    m.querySelectorAll('[data-mp]').forEach(b=>b.onclick=()=>{ const l=st[+b.dataset.mp]; l.q=l.q+1; draw(); });
    m.querySelectorAll('[data-mq]').forEach(inp=>inp.onchange=()=>{ st[+inp.dataset.mq].q=Math.max(0,parseInt(inp.value,10)||0); draw(); });
    m.querySelectorAll('[data-mbf]').forEach(sg=>sg.querySelectorAll('button').forEach(b=>b.onclick=()=>{ st[+sg.dataset.mbf].bf=b.dataset.bf; draw(); }));
  };
  openSheet(`<div id="modSheet"><h2>Modify &amp; ask ${esc(o.spName.split(' ')[0])}</h2><p class="muted small">${esc(o.partner)} · ${esc(o.no)}. Change quantities or billing; the sales person confirms on his screen before you execute.</p>
    <div id="modLines" style="margin-top:12px"></div>
    <div class="lbl" style="margin-top:6px">Message to sales person</div><textarea class="field" id="modNote" placeholder="e.g. Only 30 pcs at branch, balance not available">${esc(o.proposed&&o.proposed.note||'')}</textarea>
    <button class="btn primary block" id="modGo" style="margin-top:14px">Send for confirmation</button></div>`, ()=>{
    draw();
    $('#modGo').onclick=async()=>{ const b=$('#modGo'); b.disabled=true;
      try{ await call('proposeChange',{orderNo:o.no, note:$('#modNote').value, items:st.map(l=>({p:l.p,q:l.q,bf:l.bf}))});
        closeSheet(); toast('Sent to '+o.spName.split(' ')[0]+' for confirmation'); afterOrderChange(); }
      catch(e){ toast(e.message,true); b.disabled=false; } };
  });
}
function respond(o,accept){
  if(!o) return;
  const p=o.proposed||{};
  openSheet(`<h2>${accept?'Accept changes?':'Decline changes?'}</h2>
    <p class="muted small">${accept?`The order becomes ${inr2(p.invoice)} and goes back to the accountant for billing.`:'The original order stays as you placed it. The accountant may still cancel it if stock is short.'}</p>
    <div class="lbl" style="margin-top:14px">Message (optional)</div><input class="field" id="rsNote" placeholder="${accept?'e.g. Party agreed':'e.g. Party needs full qty, please arrange from HO'}">
    <button class="btn ${accept?'ok':'danger'} block" id="rsGo" style="margin-top:16px">${accept?'Accept changes':'Decline changes'}</button>`, ()=>{
    $('#rsGo').onclick=async()=>{ const b=$('#rsGo'); b.disabled=true;
      try{ await call('respondChange',{orderNo:o.no,accept,note:$('#rsNote').value}); closeSheet(); toast(accept?'Changes accepted':'Changes declined'); afterOrderChange(); }
      catch(e){ toast(e.message,true); b.disabled=false; } };
  });
}

function isoDay(d){ const t=new Date(d.getTime()-d.getTimezoneOffset()*6e4); return t.toISOString().slice(0,10); }
function defaultRange(){ const to=new Date(), from=new Date(Date.now()-30*864e5); return {from:isoDay(from), to:isoDay(to)}; }
function rangeBar(r, label){
  return `<div class="row" style="gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:flex-end">
    <div><div class="lbl">${label} from</div><input class="field" type="date" id="rf" value="${r.from}" style="width:150px;height:42px"></div>
    <div><div class="lbl">to</div><input class="field" type="date" id="rt" value="${r.to}" style="width:150px;height:42px"></div>
    <div class="chips" style="margin:0">${[['7','7 days'],['30','30 days'],['90','3 months'],['365','1 year']].map(([d,l])=>`<button class="fchip" data-rd="${d}">${l}</button>`).join('')}</div></div>`;
}
function bindRange(r, reload){
  const go2=()=>{ r.from=$('#rf').value||r.from; r.to=$('#rt').value||r.to; reload(); };
  $('#rf').onchange=go2; $('#rt').onchange=go2;
  document.querySelectorAll('[data-rd]').forEach(b=>b.onclick=()=>{ $('#rt').value=isoDay(new Date()); $('#rf').value=isoDay(new Date(Date.now()-(+b.dataset.rd)*864e5)); go2(); });
}

  if(!S.branch){ $('#main').innerHTML='<div class="card empty">No branch assigned.</div>'; return; }

  const key=()=>'hist_'+f+'_'+R.from+'_'+R.to;
  $('#main').innerHTML=`<div class="view"><div class="seg" id="hseg">${['EXECUTED','CANCELLED'].map(s=>`<button data-s="${s}" class="${f===s?'on':''}">${s[0]+s.slice(1).toLowerCase()}</button>`).join('')}</div>
    ${rangeBar(R, f==='EXECUTED'?'Executed':'Cancelled')}
    <div id="bcw"></div>
    <div class="row" style="gap:8px;margin-bottom:12px"><div class="sbox grow" style="margin:0">${IC.search}<input class="field" id="hq" placeholder="Partner name, order no, sales person"></div><button class="btn ghost sm" id="hx">Export</button></div>
    <div class="small muted" id="hinfo" style="margin:-4px 2px 8px"></div><div id="hlist">${'<div class="skel"></div>'.repeat(3)}</div></div>`;

    $('#hlist').innerHTML = shown.length? shown.map(o=>orderCard(o,{showSp:true,manage:canAct(),mine:o.sp===S.user.code,showBranch:S.user.branches.length>1})).join('') : '<div class="card empty">No orders in these dates.</div>'; bindOrderCards($('#hlist'),shown); };

async function viewTeam(){
  const m=S.month, branches=(S.user.role==='ADMIN'||S.user.branches.length>1)?['',...S.user.branches]:S.user.branches;

    ${branches.length>1?`<div class="chips">${branches.map(b=>`<button class="fchip ${S.teamBranch===b?'on':''}" data-tb="${esc(b)}">${b||'All branches'}</button>`).join('')}</div>`:''}
    <div id="tbody"><div class="skel" style="height:120px"></div><div class="skel"></div><div class="skel"></div></div></div>`;

  const tkey='team_'+m+'_'+S.teamBranch;

    if(S.tab!=='team'||S.month!==m||!$('#tbody')) return;
    const sp={};
    Object.entries(r.targets).forEach(([code,t])=>{ if(t.role!=='SALES') return; const bs=t.branches.split(/[,;|]/).map(x=>x.trim());
      if(S.teamBranch ? bs.includes(S.teamBranch) : (S.user.role==='ADMIN' || bs.some(b=>S.user.branches.includes(b)))) sp[code]={code,n:t.name,t:t.target,a:0,p:0,c:0}; });
    r.orders.forEach(o=>{ const s=sp[o.sp]=sp[o.sp]||{code:o.sp,n:o.spName,t:(r.targets[o.sp]||{}).target||0,a:0,p:0,c:0};
      if(o.status==='EXECUTED'){ s.a+=o.taxable; s.c++; } else if(o.status==='PENDING') s.p+=o.taxable; });

    const A=list.reduce((x,s)=>x+s.a,0), T=list.reduce((x,s)=>x+s.t,0), P=list.reduce((x,s)=>x+s.p,0);
    $('#tbody').innerHTML=`<div class="hero"><div class="lab">${esc(S.teamBranch||'All branches')} · executed (taxable)</div><div class="big num">${inr(A)}</div>

      <div class="kpis"><div class="kpi"><div class="lab">Sales persons</div><div class="v num">${list.length}</div></div><div class="kpi"><div class="lab">Pending value</div><div class="v num">${inr(P)}</div></div><div class="kpi"><div class="lab">Orders executed</div><div class="v num">${list.reduce((x,s)=>x+s.c,0)}</div></div></div>
      <div class="card"><table class="t"><tr><th>Sales person</th><th class="r">Achieved</th><th class="r">%</th></tr>
      ${list.map(s=>`<tr data-sp="${esc(s.code)}" style="cursor:pointer"><td><b>${esc(s.n)}</b><div class="small muted">${s.c} executed · pending ${inr(s.p)}${s.t?' · target '+inr(s.t):''}</div>${s.t?`<div class="pbar"><i style="width:${Math.min(100,s.a/s.t*100)}%"></i></div>`:''}</td><td class="r num">${inr(s.a)}</td><td class="r num">${s.t?(s.a/s.t*100).toFixed(0)+'%':'—'}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">No sales persons.</td></tr>'}</table></div>`;
    setTimeout(()=>{ const hb=$('#hb'); if(hb) hb.style.width=Math.min(100,A/T*100)+'%'; },60);
    document.querySelectorAll('[data-sp]').forEach(tr=>tr.onclick=()=>{ const s=sp[tr.dataset.sp]; const ex=r.orders.filter(o=>o.sp===s.code&&o.status==='EXECUTED');
      openSheet(`<h2>${esc(s.n)}</h2><p class="muted small">${monthLabel(m)} · ${inr(s.a)} executed</p>${breakdown(ex)}`, bindBreakdown); });
  };
  const c=C.get(tkey); if(c) draw(c);

  catch(e){ if(!c) $('#tbody').innerHTML=`<div class="card empty">${esc(e.message)}</div>`; }
}

      <div class="row" style="margin-top:14px;flex-wrap:wrap"><button class="btn sm" id="aR" style="background:#fff;color:#0b1220">Refresh from mail now</button><label class="btn sm" style="background:#ffffff22;color:#fff;cursor:pointer">Upload report…<input type="file" id="aU" accept=".xlsx" class="hidden"></label></div></div>
    <div class="kpis"><div class="kpi"><div class="lab">Active users</div><div class="v num">${r.userCount}</div></div><div class="kpi"><div class="lab">Branches</div><div class="v num">${r.branches.length}</div></div><div class="kpi"><div class="lab">Pending orders</div><div class="v num">${pb.reduce((a,x)=>a+x[1].pending,0)}</div></div></div>

    <div class="card"><div class="ct"><h3>Pending by branch</h3></div><table class="t"><tr><th>Branch</th><th class="r">Orders</th><th class="r">Value</th></tr>${pb.map(([b,v])=>`<tr data-pb="${esc(b)}" style="cursor:pointer"><td><b>${esc(b)}</b></td><td class="r num">${v.pending}</td><td class="r num">${inr(v.value)}</td></tr>`).join('')||'<tr><td colspan="3" class="muted">No pending orders</td></tr>'}</table></div>
    <div class="card"><div class="ct" id="logHead" style="cursor:pointer;margin:0"><h3>Activity log · ${r.logCount||0} entries</h3><span class="small" style="color:var(--brand);font-weight:700" id="logTog">Show ▾</span></div><div id="logBody" class="hidden" style="margin-top:12px"></div></div>`;
  $('#aR').onclick=async()=>{ try{ const x=await call('adminRefreshStock'); toast(x.message, !x.imported); afterStock(); }catch(e){ toast(e.message,true);} };
  $('#aS').onclick=async()=>{ if(!confirm('Create logins for every sales person listed in the latest report (Sales Main Fund-SP)? Existing users are not changed.')) return;
    try{ const x=await call('adminSeedUsers'); toast(x.added+' users created — see Users'); C.del('ov'); viewOverview(); }catch(e){ toast(e.message,true);} };
  $('#aU').onchange=e=>{ const f=e.target.files[0]; if(!f) return; const rd=new FileReader();
    rd.onload=async()=>{ try{ const b64=rd.result.split(',')[1]; const x=await call('adminUploadReport',{base64:b64,name:f.name}); toast(x.message); afterStock(); }catch(err){ toast(err.message,true);} };
    rd.readAsDataURL(f); };
  document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>({users:viewUsers,partners:viewPartners,branches:viewBranches}[b.dataset.m])());

async function toggleLog(){
  const body=$('#logBody'), open=body.classList.toggle('hidden')===false;
  $('#logTog').textContent = open ? 'Hide ▴' : 'Show ▾';
  if(!open) return;
  body.innerHTML='<div class="skel" style="height:60px"></div>';
  try{
    const rows=S.logRows || (S.logRows=await call('adminLog',{}, {silent:true}));
    const events=[...new Set(rows.map(r=>r[1]))].sort();
    body.innerHTML=`<div class="row" style="flex-wrap:wrap;gap:8px;margin-bottom:10px">
      <input class="field" type="date" id="lf1" style="width:150px;height:40px"><input class="field" type="date" id="lf2" style="width:150px;height:40px">
      <select class="field" id="lfe" style="width:150px;height:40px"><option value="">All events</option>${events.map(e=>`<option>${esc(e)}</option>`).join('')}</select>
      <input class="field grow" id="lfq" placeholder="User ID, order no, text…" style="height:40px;min-width:160px"></div><div id="lfl" class="lgx"></div>`;
    const draw=()=>{ const d1=$('#lf1').value, d2=$('#lf2').value, ev=$('#lfe').value, q=$('#lfq').value.trim().toLowerCase();
      const f=rows.filter(r=>{ const d=(r[0]||'').slice(0,10); return (!d1||d>=d1)&&(!d2||d<=d2)&&(!ev||r[1]===ev)&&(!q||(r[1]+' '+r[2]).toLowerCase().includes(q)); });
      $('#lfl').innerHTML=`<div class="small muted" style="margin-bottom:6px">Showing ${Math.min(f.length,150)} of ${f.length}</div>`+f.slice(0,150).map(l=>`<div class="rl"><div class="grow"><b>${esc(l[1])}</b> <span class="muted">${esc(l[2])}</span></div><div class="muted" style="white-space:nowrap">${fmtDate(l[0],true)}</div></div>`).join(''); };
    ['lf1','lf2','lfe'].forEach(id=>$('#'+id).onchange=draw); $('#lfq').oninput=draw; draw();
  }catch(e){ body.innerHTML=`<div class="empty">${esc(e.message)}</div>`; }
}

function nextCode(branch){
  const pre=(branch||'').replace(/[^A-Z]/g,'').slice(0,3)||'USR', l=C.get('users')||[];
  let mx=0; l.forEach(u=>{ if(u.code.indexOf(pre)===0){ const n=parseInt(u.code.slice(pre.length),10); if(n>mx) mx=n; } });
  return pre+String(mx+1).padStart(2,'0');
}

    <div class="row" style="margin-top:10px"><div class="grow"><div class="lbl">Email (gets "order executed" mails)</div><input class="field" id="ue" value="${esc(u.email)}" inputmode="email"></div><div style="width:140px"><div class="lbl">Monthly target ₹</div><input class="field num" id="ut" value="${esc(u.target||'')}" inputmode="numeric"></div></div>

      HOD:'Sales head: places orders and views pending / executed orders and team sales of the assigned branches (cannot execute).',
      ADMIN:'Everything, plus Users, Partners, Branches and stock refresh.'};
    const setRoleUi=()=>{ $('#ubl').textContent = role==='ACCOUNTANT' ? 'Stock depot(s) — covers every branch drawing from it' : role==='ADMIN' ? 'Branches (admin sees all)' : role==='HOD' ? 'Assigned branches' : 'Branches'; $('#urh').textContent=HELP[role]||''; };

/* ==================================================================
   NOTIFICATIONS (bell + alert bar)
   ================================================================== */
let lastNotify=-1, notifyT=null;
async function pollNotify(){
  if(!S.user||!S.token) return;
  try{
    const n=await call('notify',{},{silent:true}); S.notify=n;
    if(n.stockKey && S.boot && n.stockKey!==S.boot.stockKey){ S.boot.stockKey=n.stockKey; S.catalog={}; if(S.branch && ['order','stock'].includes(S.tab)) loadCatalog(S.branch).then(refreshSearch).catch(()=>{}); }
    const total=n.total+(n.updates||0);
    const el=$('#bellN'); el.textContent=total; el.classList.toggle('hidden',!total);
    const seenAt=store.get('bellSeen_'+S.user.code,'');
    $('#bell').classList.toggle('dot', !total && (n.recent||[]).some(c=>c.at>seenAt));
    if(lastNotify>=0 && n.total>lastNotify){
      $('#bell').classList.remove('ring'); void $('#bell').offsetWidth; $('#bell').classList.add('ring');
      try{ navigator.vibrate && navigator.vibrate([120,60,120]); }catch(e){}
      const c=n.chats[0], q=n.queries[0], ak=(n.asks||[])[0], an=(n.answers||[])[0];
      showAlert(c ? {t:'New message from '+c.from, s:c.partner+' · '+c.last, no:c.no} : q ? {t:'Accountant needs your OK', s:q.partner+' · '+q.no, no:q.no, q:true}
        : ak ? {t:ak.by+' asks about stock', s:ak.sku+' · '+ak.branch, bell:true} : an ? {t:an.sku+(an.answer==='RECEIVED'?': in stock today':': no stock'), s:'Answered by '+an.ansBy, bell:true} : null);
    }
    lastNotify=n.total;
  }catch(e){}
  clearTimeout(notifyT); notifyT=setTimeout(()=>{ if(document.visibilityState==='visible') pollNotify(); else notifyT=setTimeout(pollNotify,30000); }, 25000);
}
function showAlert(a){
  if(!a) return;
  $('#alertbar').innerHTML=`<div class="abar"><div class="grow" style="min-width:0"><b>${esc(a.t)}</b><span>${esc(a.s)}</span></div><button class="btn sm" id="abO">Open</button><button class="xx" id="abX">×</button></div>`;
  $('#abX').onclick=()=>$('#alertbar').innerHTML='';
  $('#abO').onclick=()=>{ $('#alertbar').innerHTML=''; if(a.bell) $('#bell').click(); else openOrderChat(a.no, a.q); };
}
async function openOrderChat(no, query){
  try{ const o=await call('getOrder',{orderNo:no}); if(query){ if(S.user.role==='SALES'){ S.filters.ord='PENDING'; go('orders'); } else go('pending'); } else openChat(o); }catch(e){ toast(e.message,true); }
}
$('#bell').addEventListener('click',()=>{
  const n=S.notify||{chats:[],queries:[],updates:0,recent:[]};
  store.set('bellSeen_'+S.user.code, new Date().toISOString()); $('#bell').classList.remove('dot');
  const rec=n.recent||[], asks=n.asks||[], ans=n.answers||[];
  if(ans.length) call('ackAsks',{},{silent:true}).then(()=>pollNotify()).catch(()=>{});
  openSheet(`<h2>Notifications</h2><p class="muted small">Unread chats and orders waiting for you.</p><div style="margin-top:12px">
    ${asks.map(a=>`<div class="ni" data-ask-id="${esc(a.id)}"><div class="ic sk">?</div><div class="grow"><b>${esc(a.by)} asks: is ${esc(a.sku)} in stock?</b><div class="small muted">${esc(a.desc)} · ${esc(a.branch)} · ${fmtDate(a.at,true)}</div>
      <div class="ibtns"><button class="btn ok sm" data-ans="RECEIVED" data-id="${esc(a.id)}">Received today</button><button class="btn ghost sm" data-ans="NO_STOCK" data-id="${esc(a.id)}">No stock</button></div></div></div>`).join('')}
    ${ans.map(a=>`<div class="ni"><div class="ic" style="background:${a.answer==='RECEIVED'?'var(--ok)':'var(--bad)'}">${a.answer==='RECEIVED'?'✓':'×'}</div><div class="grow"><b>${esc(a.sku)}: ${a.answer==='RECEIVED'?'in stock at '+esc(a.branch)+' today':'no stock at '+esc(a.branch)}</b><div class="small muted">${esc(a.desc)} · answered by ${esc(a.ansBy)}</div>${a.answer==='RECEIVED'?'<div class="small" style="margin-top:3px">You can now bill it from the branch.</div>':'<div class="small" style="margin-top:3px">Bill from Head Office if available.</div>'}</div></div>`).join('')}
    ${n.queries.map(q=>`<div class="ni" data-q="${esc(q.no)}"><div class="ic q">!</div><div class="grow"><b>Confirm accountant's changes</b><div class="small muted">${esc(q.partner)} · ${esc(q.no)}</div></div></div>`).join('')}
    ${n.chats.map(c=>`<div class="ni" data-c="${esc(c.no)}"><div class="ic">${c.count}</div><div class="grow"><b>${esc(c.from)} · ${esc(c.partner)}</b><div class="small muted">${esc(c.no)}${c.branch?' · '+esc(c.branch):''} · ${fmtDate(c.at,true)}</div><div class="small" style="margin-top:3px">${esc(c.last)}</div></div></div>`).join('')}
    ${n.updates?`<div class="ni" data-up="1"><div class="ic" style="background:var(--ok)">${n.updates}</div><div class="grow"><b>Orders executed / cancelled</b><div class="small muted">Tap to see My Orders</div></div></div>`:''}
    ${!n.queries.length&&!n.chats.length&&!n.updates&&!rec.length&&!asks.length&&!ans.length?'<div class="empty">You are all caught up.</div>':''}
    ${rec.length?`<div class="lbl" style="margin:16px 2px 8px">Recent chats in your branches &middot; view only, no alerts</div>`+rec.map(c=>`<div class="ni quiet" data-c="${esc(c.no)}"><div class="ic">${c.count}</div><div class="grow"><b>${esc(c.from)} &middot; ${esc(c.partner)}</b><div class="small muted">${esc(c.no)} &middot; ${esc(c.branch)} &middot; ${fmtDate(c.at,true)}</div><div class="small" style="margin-top:3px">${esc(c.last)}</div></div></div>`).join(''):''}</div>`, el=>{
      el.querySelectorAll('[data-c]').forEach(x=>x.onclick=()=>{ closeSheet(); openOrderChat(x.dataset.c); });
      el.querySelectorAll('[data-ans]').forEach(x=>x.onclick=async e=>{ e.stopPropagation(); x.disabled=true;
        try{ const r=await call('answerAsk',{id:x.dataset.id, answer:x.dataset.ans}); toast(r.answer==='RECEIVED'?'Marked received today — the sales person can bill it now':'Sales person told: no stock'); x.closest('.ni').remove(); S.boot.stockKey=r.stockKey; S.catalog={}; pollNotify(); }
        catch(err){ toast(err.message,true); x.disabled=false; } });
      el.querySelectorAll('[data-q]').forEach(x=>x.onclick=()=>{ closeSheet(); if(S.user.role==='SALES'){ S.filters.ord='PENDING'; go('orders'); } else go('pending'); });
      el.querySelectorAll('[data-up]').forEach(x=>x.onclick=()=>{ closeSheet(); if(S.user.role==='SALES'){ S.filters.ord='ALL'; go('orders'); } else go('history'); });
    });
});

/* ==================================================================
   SHEET (modal)
   ================================================================== */
function openSheet(html, bind){
  const ov=$('#overlay');
  ov.innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog"><div class="grab"></div><button class="sx" id="sx" aria-label="Close">×</button>${html}</div>`;
  $('#sx').onclick=closeSheet;
  $('#scrim').onclick=closeSheet;
  document.body.style.overflow='hidden';
  if(bind) bind(ov.querySelector('.sheet'));
}
function closeSheet(){ $('#overlay').innerHTML=''; document.body.style.overflow=''; }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });

/* ==================================================================
   START
   ================================================================== */
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible' && S.user){ pollNotify(); if(S.user.role==='SALES' && !$('#chatList')) refreshMyOrders(true); } });
setInterval(()=>{ if(S.user && S.user.role==='SALES' && document.visibilityState==='visible' && !$('#chatList')) refreshMyOrders(true); },60000);
(async function start(){
  S.token = store.get('token', null);
  if(!S.token) return showLogin();
  try{ await boot(); }catch(e){ showLogin(); }
})();
})();
</script>
</body>
</html>
